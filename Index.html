<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Business Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="business-card">
    <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="Profile photo">
    <p class="full-name">Jayvonta Waters</p>
    <p class="designation">Founder & CEO</p>
    <p class="company">NVZN</p>
    <hr>
    <p>contact@example.com</p>
    <p>(555) 555-5555</p>
    <a class="portfolio-link" href="https://www.shopnvzn.com" target="_blank">Portfolio</a>
    <hr>
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="https://twitter.com">Twitter</a>
      <a href="https://linkedin.com">LinkedIn</a>
      <a href="https://github.com">GitHub</a>
    </div>
  </div>
</body>
</html>
